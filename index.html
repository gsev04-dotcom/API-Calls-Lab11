<!DOCTYPE html>
<html lang="en">
     <head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Calls Lab 11</title>
    <link rel="stylesheet" href="style.css">
   
   </head>

<body>

 <div class="buttons">

<button id="fetchBtn">Fetch Data with fetch()</button>

<button id="xhrBtn">Fetch Data with XHR</button>

</div>


 <form id="apiform">

<h2>Add a post or Update Existing</h2>

<label>
    Post ID:
    <input type="number" id="postId">
</label>


<label>
    Title:
    <input type="text" id="title" name="title" required>
</label>


<label>
    Body:
    <input type="text" id="body" name="body" required>
</label>

<div class="form-buttons">

    <button type="submit" id="postBtn">Send POST</button>

    <button type="button" id="putBtn">Send PUT</button>

</div>


 </form>

<div id="display">Results will be displayed here!</div>
<script src="script.js"></script>

</body>
</html>
